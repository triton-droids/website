version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    labels:
      - "dependencies"
    groups:
      # Patch and minor updates are safe to review together
      npm-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major versions require manual migration — review individually
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # eslint ecosystem is pinned to v8 — plugins with new peer dep requirements
      # on eslint v9/v10 must be upgraded together with eslint itself
      - dependency-name: "eslint-plugin-react-refresh"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    labels:
      - "dependencies"
      - "github-actions"
