name: Bug
description: Something on the site is broken
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What's broken
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Repro
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL / route
  - type: input
    id: env
    attributes:
      label: Browser / device
      placeholder: e.g. Chrome 124 / iPhone 14 Safari
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - site broken in prod
        - P1 - visible regression
        - P2 - minor
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / console errors
